<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SAP ABAP Code Optimization</title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>

<body>

    <div class="container">

        <h1>SAP ABAP Code Optimization</h1>

        <p>
            Optimize SAP ABAP code using retrieved
            optimization standards and an iterative
            validation workflow.
        </p>


        <div class="form-group">

            <label for="original-code">
                Existing SAP ABAP Code
            </label>

            <textarea
                id="original-code"
                rows="20"
                placeholder="Paste your SAP ABAP code here..."
            ></textarea>

        </div>


        <button
            id="optimize-button"
        >
            Optimize ABAP
        </button>


        <div
            id="loading"
            style="display: none;"
        >
            Retrieving optimization rules,
            optimizing and validating ABAP...
        </div>


        <div
            id="result-section"
            style="display: none;"
        >

            <h2>Optimized ABAP Code</h2>

            <pre>
                <code
                    id="optimized-code"
                ></code>
            </pre>


            <h2>Validation</h2>

            <div id="validation-status"></div>

            <div id="validation-errors"></div>


            <h2>Optimization Details</h2>

            <p>
                Iterations:
                <span id="iterations"></span>
            </p>


            <h2>Retrieved Rules / Sources</h2>

            <div id="sources"></div>

        </div>

    </div>


    <script
        src="{{ url_for(
            'static',
            filename='js/sap_optimization.js'
        ) }}"
    ></script>

</body>

</html>
